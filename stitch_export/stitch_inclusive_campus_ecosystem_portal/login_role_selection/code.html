<style>
        @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap');
        
        body {
            background-color: #ffffff; /* Pure white as requested */
        }
        
        /* Focus state for all interactive elements */
        *:focus-visible {
            outline: 4px solid #FFD600;
            outline-offset: 2px;
        }

        /* Custom radio buttons to match guidelines */
        .custom-radio {
            appearance: none;
            width: 32px;
            height: 32px;
            border: 2px solid #333333;
            border-radius: 0;
            display: grid;
            place-content: center;
            background-color: white;
            cursor: pointer;
        }

        .custom-radio::before {
            content: "";
            width: 16px;
            height: 16px;
            background-color: #003469; /* Primary */
            transform: scale(0);
            transition: 120ms transform ease-in-out;
        }

        .custom-radio:checked::before {
            transform: scale(1);
        }
        
        /* High contrast button inversion on active/pressed */
        .btn-primary:active {
            background-color: white !important;
            color: #003469 !important;
            border: 2px solid #003469 !important;
        }
        
        /* Hide visually */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Main Container -->
<main class="w-full max-w-[800px] mx-auto bg-surface-container-lowest border-[4px] border-border-dark p-6 md:p-12">
<!-- Header -->
<header class="mb-12 text-center border-b-[4px] border-border-dark pb-8">
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg text-high-contrast-text mb-2">Saksham Setu</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Welcome. Please select your role to continue.</p>
</header>
<!-- Role Selection Form -->
<form class="space-y-8" id="loginForm">
<fieldset class="border-2 border-border-dark p-6">
<legend class="font-headline-md text-headline-md text-high-contrast-text px-2 bg-surface-container-lowest">Select Role</legend>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
<!-- Student Role -->
<label class="flex items-start gap-4 p-4 border-2 border-border-dark cursor-pointer hover:bg-surface-container transition-colors" for="role-student">
<input class="custom-radio mt-1" id="role-student" name="role" type="radio" value="student">
<div class="flex flex-col">
<span class="font-label-bold text-label-bold text-high-contrast-text flex items-center gap-2">
<span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">school</span>
                                Student
                            </span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">Access educational resources and tools.</span>
</div>
</label>
<!-- Administration Role -->
<label class="flex items-start gap-4 p-4 border-2 border-border-dark cursor-pointer hover:bg-surface-container transition-colors" for="role-admin">
<input class="custom-radio mt-1" id="role-admin" name="role" type="radio" value="admin">
<div class="flex flex-col">
<span class="font-label-bold text-label-bold text-high-contrast-text flex items-center gap-2">
<span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
                                Administration
                            </span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">Manage users, curriculum, and settings.</span>
</div>
</label>
</div>
</fieldset>
<!-- Disability Selection (Hidden by default, shown via JS if Student is selected) -->
<fieldset class="border-2 border-border-dark p-6 hidden" id="disabilitySection"><legend class="font-headline-md text-headline-md text-high-contrast-text px-2 bg-surface-container-lowest">Select Disability Mode</legend><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4"><label class="flex items-center gap-4 p-4 border-2 border-border-dark cursor-pointer hover:bg-surface-container transition-colors" for="acc-voice"><input class="custom-radio" id="acc-voice" name="accessibility" type="radio" value="voice"><span class="font-label-bold text-label-bold text-high-contrast-text flex items-center gap-2"><span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">record_voice_over</span>Voice-First (Visual/Dyslexic)</span></label><label class="flex items-center gap-4 p-4 border-2 border-border-dark cursor-pointer hover:bg-surface-container transition-colors" for="acc-hearing"><input class="custom-radio" id="acc-hearing" name="accessibility" type="radio" value="hearing"><span class="font-label-bold text-label-bold text-high-contrast-text flex items-center gap-2"><span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">hearing_disabled</span>Hearing Impaired</span></label><label class="flex items-center gap-4 p-4 border-2 border-border-dark cursor-pointer hover:bg-surface-container transition-colors" for="acc-physical"><input class="custom-radio" id="acc-physical" name="accessibility" type="radio" value="physical"><span class="font-label-bold text-label-bold text-high-contrast-text flex items-center gap-2"><span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">accessible</span>Physically Challenged</span></label></div></fieldset>
<!-- Actions -->
<div class="pt-6 border-t-[4px] border-border-dark flex justify-end">
<button class="btn-primary min-h-[56px] min-w-[150px] bg-primary text-on-primary font-label-bold text-label-bold px-8 py-4 border-2 border-transparent" id="continueBtn" type="button">
                    CONTINUE
                </button>
</div>
</form>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const roleStudent = document.getElementById('role-student');
            const roleAdmin = document.getElementById('role-admin');
            const disabilitySection = document.getElementById('disabilitySection');
            const continueBtn = document.getElementById('continueBtn');
            const form = document.getElementById('loginForm');

            // Handle Role Selection Toggle
            function updateVisibility() {
                if (roleStudent.checked) {
                    disabilitySection.classList.remove('hidden');
                    // Reset accessibility selection if switching roles
                    const accRadios = document.querySelectorAll('input[name="accessibility"]');
                    accRadios.forEach(radio => radio.checked = false);
                } else {
                    disabilitySection.classList.add('hidden');
                }
            }

            roleStudent.addEventListener('change', updateVisibility);
            roleAdmin.addEventListener('change', updateVisibility);

            // Handle Continue Action (Mock)
            continueBtn.addEventListener('click', () => {
                const selectedRole = document.querySelector('input[name="role"]:checked');
                
                if (!selectedRole) {
                    alert("Please select a role to continue.");
                    return;
                }

                if (selectedRole.value === 'student') {
                    const selectedNeed = document.querySelector('input[name="accessibility"]:checked');
                    if (!selectedNeed) {
                        alert("Please select an accessibility need.");
                        return;
                    }
                    console.log("Proceeding as Student with need:", selectedNeed.value);
                    // In a real app, redirect or load appropriate interface here
                } else {
                    console.log("Proceeding as Administration");
                    // In a real app, redirect to admin login/dashboard
                }
            });
        });
    </script>
