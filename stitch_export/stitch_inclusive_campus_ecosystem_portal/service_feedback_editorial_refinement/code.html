<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Student Feedback</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..800;1,400..800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "visual-active": "#006B3D",
                        "surface-tint": "#255fa6",
                        "outline": "#727782",
                        "secondary": "#046d3f",
                        "surface-container-low": "#f3f3f4",
                        "border-dark": "#333333",
                        "surface-container-high": "#e8e8e8",
                        "primary": "#003469",
                        "outline-variant": "#c2c6d2",
                        "on-secondary-fixed-variant": "#00522e",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#d5e3ff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#001b3c",
                        "surface": "#f9f9f9",
                        "secondary-fixed-dim": "#81d9a0",
                        "on-tertiary-fixed": "#341100",
                        "on-tertiary-fixed-variant": "#793100",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed": "#00210f",
                        "surface-bright": "#f9f9f9",
                        "focus-indicator": "#FFD600",
                        "secondary-fixed": "#9df5bb",
                        "inverse-surface": "#2f3131",
                        "background": "#f9f9f9",
                        "primary-container": "#004b91",
                        "tertiary-fixed-dim": "#ffb691",
                        "high-contrast-text": "#1A1A1A",
                        "surface-container": "#eeeeee",
                        "on-background": "#1a1c1c",
                        "secondary-container": "#9af3b8",
                        "surface-dim": "#dadada",
                        "surface-variant": "#e2e2e2",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#004689",
                        "tertiary": "#5c2400",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f0f1f1",
                        "primary-fixed-dim": "#a7c8ff",
                        "on-surface-variant": "#424751",
                        "on-secondary-container": "#0f7142",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "emergency-red": "#D92D20",
                        "on-primary-container": "#95bdff",
                        "on-tertiary-container": "#ffa678",
                        "tertiary-fixed": "#ffdbcb",
                        "tertiary-container": "#7f3502",
                        "on-surface": "#1a1c1c",
                        "inverse-primary": "#a7c8ff",
                        "voice-active": "#004B91"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "56px",
                        "margin-mobile": "16px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "unit": "8px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Noto Serif"],
                        "body-md": ["Noto Serif"],
                        "headline-lg-mobile": ["Noto Serif"],
                        "headline-md": ["Noto Serif"],
                        "code-display": ["Noto Serif"],
                        "label-bold": ["Noto Serif"],
                        "body-lg": ["Noto Serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "800" }],
                        "body-md": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "800" }],
                        "headline-md": ["28px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "code-display": ["48px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "800" }],
                        "label-bold": ["16px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["20px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .fill-icon { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-surface-container-lowest text-high-contrast-text min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<main class="w-full max-w-container-max flex flex-col gap-12 md:gap-16">
<header class="flex flex-col items-center text-center gap-4">
<span aria-hidden="true" class="material-symbols-outlined text-6xl text-secondary fill-icon" data-icon="task_alt">task_alt</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-high-contrast-text border-b border-border-dark pb-4 w-full max-w-3xl">
                Service Completed
            </h1>
<p class="font-body-lg text-body-lg text-on-surface max-w-2xl mt-4">
                Please rate your experience to help us improve.
            </p>
</header>
<form class="flex flex-col gap-12 w-full max-w-3xl mx-auto" onsubmit="event.preventDefault(); window.location.href='#';">
<fieldset class="flex flex-col gap-6">
<legend class="font-headline-md text-headline-md text-high-contrast-text text-center w-full mb-4 border-b border-border-dark pb-2">
                    Rating (1 is Poor, 5 is Excellent)
                </legend>
<div aria-label="Rating scale from 1 to 5" class="flex flex-wrap justify-center gap-4 md:gap-8 mt-4" role="group">
<button aria-label="Rate 1 out of 5" aria-pressed="false" class="rating-btn w-20 h-20 md:w-24 md:h-24 flex items-center justify-center border border-border-dark bg-surface-container-lowest text-on-surface font-code-display text-code-display focus:outline-none focus:ring-4 focus:ring-focus-indicator focus:border-transparent transition-colors duration-150 rounded-lg" type="button">
                        1
                    </button>
<button aria-label="Rate 2 out of 5" aria-pressed="false" class="rating-btn w-20 h-20 md:w-24 md:h-24 flex items-center justify-center border border-border-dark bg-surface-container-lowest text-on-surface font-code-display text-code-display focus:outline-none focus:ring-4 focus:ring-focus-indicator focus:border-transparent transition-colors duration-150 rounded-lg" type="button">
                        2
                    </button>
<button aria-label="Rate 3 out of 5" aria-pressed="false" class="rating-btn w-20 h-20 md:w-24 md:h-24 flex items-center justify-center border border-border-dark bg-surface-container-lowest text-on-surface font-code-display text-code-display focus:outline-none focus:ring-4 focus:ring-focus-indicator focus:border-transparent transition-colors duration-150 rounded-lg" type="button">
                        3
                    </button>
<button aria-label="Rate 4 out of 5" aria-pressed="false" class="rating-btn w-20 h-20 md:w-24 md:h-24 flex items-center justify-center border border-border-dark bg-surface-container-lowest text-on-surface font-code-display text-code-display focus:outline-none focus:ring-4 focus:ring-focus-indicator focus:border-transparent transition-colors duration-150 rounded-lg" type="button">
                        4
                    </button>
<button aria-label="Rate 5 out of 5" aria-pressed="false" class="rating-btn w-20 h-20 md:w-24 md:h-24 flex items-center justify-center border border-border-dark bg-surface-container-lowest text-on-surface font-code-display text-code-display focus:outline-none focus:ring-4 focus:ring-focus-indicator focus:border-transparent transition-colors duration-150 rounded-lg" type="button">
                        5
                    </button>
</div>
</fieldset>
<div class="flex flex-col gap-4">
<label class="font-headline-md text-headline-md text-high-contrast-text border-b border-border-dark pb-2" for="feedback-comment">
                    Optional Comments
                </label>
<textarea class="w-full border border-border-dark bg-surface-container-lowest p-6 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-4 focus:ring-focus-indicator focus:border-transparent resize-y rounded-lg mt-2" id="feedback-comment" name="feedback-comment" placeholder="Type your comments here..." rows="5"></textarea>
</div>
<div class="flex justify-center mt-8 border-t border-border-dark pt-8">
<button class="w-full md:w-auto min-w-[240px] min-h-[64px] px-8 py-4 bg-primary text-on-primary font-label-bold text-label-bold rounded-lg border border-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-4 focus:ring-focus-indicator active:bg-surface-container-lowest active:text-primary active:border-primary transition-colors duration-150 flex items-center justify-center gap-4" type="submit">
<span>Submit Feedback</span>
<span aria-hidden="true" class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
</form>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const ratingBtns = document.querySelectorAll('.rating-btn');
            
            ratingBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all buttons to default state
                    ratingBtns.forEach(b => {
                        b.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                        b.classList.add('bg-surface-container-lowest', 'text-on-surface', 'border-border-dark');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    
                    // Set active state on clicked button
                    btn.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'border-border-dark');
                    btn.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                    btn.setAttribute('aria-pressed', 'true');
                });
            });
        });
    </script>
</body></html>
